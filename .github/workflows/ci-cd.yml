name: CI/CD Pipeline - Lab 4

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: 1. Build
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalacja zależności
        run: npm install

      - name: Budowanie obrazu Docker
        run: docker build -t devops-lab4-app:latest .

  test:
    name: 2. Test (Jednostkowe + Integracyjne)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalacja zależności
        run: npm install

      - name: Testy jednostkowe
        run: npm test

      - name: Testy integracyjne (Docker Compose + Redis)
        run: |
          docker compose up -d
          sleep 5
          curl -f http://localhost:3000/health
          curl -s http://localhost:3000 | grep "Liczba odwiedzin w bazie Redis"
          docker compose down

  deploy-k8s:
    name: 3. Deploy (Kubernetes RollingUpdate)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Utworzenie klastra Kubernetes (Kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: kind

      - name: Zbudowanie i załadowanie obrazu do klastra K8s
        run: |
          DOCKER_BUILDKIT=0 docker build -t devops-lab4-app:latest .
          kind load docker-image devops-lab4-app:latest --name kind

      - name: Wdrożenie manifestów Kubernetes (ConfigMap, Deployment, Service)
        run: |
          kubectl apply -f k8s.yaml
          kubectl rollout status deployment/lab4-app-deployment --timeout=60s

      - name: Weryfikacja środowiska Kubernetes
        run: |
          kubectl get configmap,pods,svc -o wide

  notify:
    name: 4. Powiadomienie o wdrożeniu
    needs: deploy-k8s
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Wysłanie powiadomienia o statusie CI/CD
        run: |
          echo "🔔 POWIADOMIENIE CI/CD: Pipeline zakończony!"
          echo "Status wdrożenia Kubernetes: ${{ needs.deploy-k8s.result }}"
          echo "Powiadomienie e-mail GitHub Actions oraz log statusu zostały wygenerowane."
