apiVersion: v1
kind: ConfigMap
metadata:
  name: lab4-config
data:
  PORT: "3000"
  REDIS_URL: "redis://localhost:6379"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab4-app-deployment
  labels:
    app: lab4-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lab4-app
  template:
    metadata:
      labels:
        app: lab4-app
    spec:
      containers:
        - name: lab4-app
          image: devops-lab4-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: lab4-config
---
apiVersion: v1
kind: Service
metadata:
  name: lab4-app-service
spec:
  type: NodePort
  selector:
    app: lab4-app
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30080
